<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DEATH NOTE - Blacklist Database</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Inter:wght@300;400;500;600;700&family=Noto+Serif+JP:wght@600;900&display=swap" rel="stylesheet">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DeathNote">
  <meta name="theme-color" content="#09090b">
  
  <script>
    const manifest = {
      name: "DEATH NOTE - Blacklist DB",
      short_name: "DeathNote",
      start_url: ".",
      display: "standalone",
      background_color: "#09090b",
      theme_color: "#09090b",
      icons: [{
        src: "data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23dc2626'%3E%3Cpath d='M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253'/%3E%3C/svg%3E",
        sizes: "192x192",
        type: "image/svg+xml"
      }]
    };
    const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
    const manifestUrl = URL.createObjectURL(manifestBlob);
    document.write(`<link rel="manifest" href="${manifestUrl}">`);
  </script>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            death: { bg: '#09090b', panel: '#121215', card: '#18181c', border: '#27272a', accent: '#dc2626', glow: '#991b1b', gold: '#d97706', text: '#f4f4f5', muted: '#a1a1aa' }
          },
          fontFamily: { cinzel: ['Cinzel', 'serif'], serifJP: ['Noto Serif JP', 'serif'], sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
  
  <style>
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #09090b; }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: #dc2626; }
    html, body { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    .card-glow:active, .card-glow:hover { box-shadow: 0 0 15px rgba(220, 38, 38, 0.2); }
    .notebook-border { border-left: 4px solid #dc2626; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .animate-slide-up { animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-death-bg text-death-text font-sans antialiased min-h-screen selection:bg-red-900 selection:text-white pb-20 sm:pb-8">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // ★ 新しく発行していただいたURLをセットしました ★
    const API_URL = "https://script.google.com/macros/s/AKfycbwKo3-ODlst7z60YPgCnJ60ynnV6bUOptEW9bzdpU1t_LLI2Wk_ORCrTkXqLXGco7V3/exec";

    const Icons = {
      Search: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>,
      Filter: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"/></svg>,
      Copy: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>,
      Check: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"/></svg>,
      Plus: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"/></svg>,
      Edit: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>,
      Trash: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>,
      Book: () => <svg className="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>,
      Table: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 10h18M3 14h18m-9-4v8m-7 0h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>,
      Grid: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>,
      Skull: () => <svg className="w-5 h-5 text-red-500 inline-block shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M10 2a6 6 0 00-6 6v3.586l-.707.707A1 1 0 004 14h12a1 1 0 00.707-1.707L16 11.586V8a6 6 0 00-6-6zM8 17a1 1 0 102 0v-1H8v1zm4-1a1 1 0 102 0v-1h-2v1z" clipRule="evenodd"/></svg>,
      Download: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>,
      Reset: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>,
      Close: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/></svg>,
      Loading: () => <svg className="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
    };

    function App() {
      // 3つのリストデータのみ保持 (本編、ラグ対面、-AU)
      const [playersData, setPlayersData] = useState({ main: [], lag: [], au: [] });
      const [activeTab, setActiveTab] = useState('main'); // 'main' | 'lag' | 'au'
      const [isLoading, setIsLoading] = useState(true);

      const [searchTerm, setSearchTerm] = useState("");
      const [selectedClan, setSelectedClan] = useState("ALL");
      const [selectedCrimeTag, setSelectedCrimeTag] = useState("ALL");
      const [selectedDanger, setSelectedDanger] = useState("ALL");
      const [sortBy, setSortBy] = useState("date-desc");
      
      const [viewMode, setViewMode] = useState(() => window.innerWidth < 640 ? 'card' : 'table');
      const [selectedPlayer, setSelectedPlayer] = useState(null);
      const [formTarget, setFormTarget] = useState(null);
      
      const [copiedId, setCopiedId] = useState(null);
      const [toastMessage, setToastMessage] = useState("");
      const [showMobileFilters, setShowMobileFilters] = useState(false);

      const players = useMemo(() => playersData[activeTab] || [], [playersData, activeTab]);

      const loadData = async () => {
        setIsLoading(true);
        try {
          // キャッシュ回避のため、URLの後ろに現在の時刻（?t=数字）をくっつけて毎回最新を取得
          const response = await fetch(`${API_URL}?t=${Date.now()}`);
          const data = await response.json();
          
          const formatList = (list, defaultDanger, forceCrime = null) => {
            return list.map((row, idx) => {
              let crimesList = [];
              if (forceCrime) {
                crimesList = [forceCrime];
              } else if (row.罪状) {
                crimesList = row.罪状.split(/[,、\s]+/).map(c => c.trim()).filter(c => c);
              }
              
              let dangerRank = defaultDanger;
              if(row.備考 && row.備考.includes("終身名誉")) dangerRank = "S";
              else if (row.備考 && row.備考.includes("FF")) dangerRank = "A";

              return {
                id: String(Date.now() + Math.random()),
                psnid: row.PSNID || row.psnid,
                clan: row['所属クラン(当時)'] || row.クラン || "-",
                crimes: crimesList.length > 0 ? crimesList : ["不明"],
                note: row.備考 || "-",
                date: row.更新日 || "-",
                danger: dangerRank,
                platform: "Unknown"
              };
            });
          };

          setPlayersData({
            main: formatList(data.main || [], "C"),
            lag: formatList(data.lag || [], "B", "ラグ対面"),
            au: formatList(data.au || [], "A", "-AU")
          });
        } catch (error) {
          console.error("Fetch error:", error);
          showToast("データベースへの接続に失敗しました");
        } finally {
          setIsLoading(false);
        }
      };

      useEffect(() => {
        loadData();
      }, []);

      useEffect(() => {
        const handleResize = () => {};
        window.addEventListener('resize', handleResize);
        return () => window.removeEventListener('resize', handleResize);
      }, [viewMode]);

      useEffect(() => {
        setSearchTerm('');
        setSelectedClan('ALL');
        setSelectedCrimeTag('ALL');
        setSelectedDanger('ALL');
      }, [activeTab]);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(""), 3000);
      };

      const handleCopyPSNID = (psnid, e) => {
        if (e) e.stopPropagation();
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(psnid).then(() => {
            setCopiedId(psnid);
            showToast(`ID: ${psnid} をコピーしました`);
            setTimeout(() => setCopiedId(null), 2000);
          }).catch(() => copyFallback(psnid));
        } else {
          copyFallback(psnid);
        }
      };

      const copyFallback = (text) => {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        try {
          document.execCommand('copy');
          setCopiedId(text);
          showToast(`ID: ${text} をコピーしました`);
          setTimeout(() => setCopiedId(null), 2000);
        } catch (err) {
          showToast("コピーに失敗しました");
        }
        document.body.removeChild(textarea);
      };

      const clansList = useMemo(() => {
        const set = new Set();
        players.forEach(p => { if (p.clan && p.clan !== "-") set.add(p.clan); });
        return Array.from(set);
      }, [players]);

      const allCrimeTags = useMemo(() => {
        const set = new Set();
        players.forEach(p => { if (Array.isArray(p.crimes)) p.crimes.forEach(c => set.add(c)); });
        return Array.from(set);
      }, [players]);

      const filteredPlayers = useMemo(() => {
        return players.filter(player => {
          const term = searchTerm.toLowerCase();
          const matchesSearch = 
            player.psnid.toLowerCase().includes(term) ||
            (player.clan && player.clan.toLowerCase().includes(term)) ||
            (player.crimes && player.crimes.some(c => c.toLowerCase().includes(term))) ||
            (player.note && player.note.toLowerCase().includes(term));

          const matchesClan = selectedClan === "ALL" || player.clan === selectedClan;
          const matchesCrime = selectedCrimeTag === "ALL" || (player.crimes && player.crimes.includes(selectedCrimeTag));
          const matchesDanger = selectedDanger === "ALL" || player.danger === selectedDanger;

          return matchesSearch && matchesClan && matchesCrime && matchesDanger;
        }).sort((a, b) => {
          if (a.date === "-" && b.date !== "-") return 1;
          if (a.date !== "-" && b.date === "-") return -1;
          if (sortBy === "date-desc") return new Date(b.date) - new Date(a.date);
          if (sortBy === "date-asc") return new Date(a.date) - new Date(b.date);
          if (sortBy === "psnid-asc") return a.psnid.localeCompare(b.psnid);
          if (sortBy === "danger-desc") {
            const dangerRank = { "S": 4, "A": 3, "B": 2, "C": 1 };
            return (dangerRank[b.danger] || 0) - (dangerRank[a.danger] || 0);
          }
          return 0;
        });
      }, [players, searchTerm, selectedClan, selectedCrimeTag, selectedDanger, sortBy]);

      const handleSavePlayer = async (newPlayerData, isEdit, originalPsnid) => {
        showToast("データベースへ送信中...");
        
        const today = new Date();
        const dateStr = `${today.getFullYear()}/${String(today.getMonth()+1).padStart(2,'0')}/${String(today.getDate()).padStart(2,'0')}`;
        
        const sheetData = {
          PSNID: newPlayerData.psnid,
          クラン: newPlayerData.clan,
          罪状: newPlayerData.crimes.join('、'), 
          備考: newPlayerData.note,
          更新日: dateStr
        };

        const payload = isEdit ? { action: 'edit', targetPsnid: originalPsnid, data: sheetData } : { action: 'add', data: sheetData };

        try {
          const response = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify(payload)
          });
          
          let result = {};
          try { result = await response.json(); } catch(e) {}
          
          // ★ 古いシステムに繋がっている場合の警告
          if (result.status === 'success' && result.action_performed === undefined) {
             alert("【警告】\nアプリに設定されているURLが古いままです！\nスプレッドシート側で「新しいデプロイ」をして、取得した新しいURLをHTMLに貼り直してください。");
             return;
          }

          await loadData();
          setFormTarget(null);
          showToast(isEdit ? `ターゲット「${newPlayerData.psnid}」を更新しました` : `ターゲット「${newPlayerData.psnid}」を追加しました`);
        } catch (error) {
          console.error(error);
          showToast("保存に失敗しました。");
        }
      };

      // ★ 削除機能
      const handleDeletePlayer = async (targetPsnid) => {
        if (!window.confirm(`本当に「${targetPsnid}」をデータベースから削除しますか？\nこの操作は元に戻せません。`)) {
          return;
        }

        showToast("削除処理中...");
        
        try {
          const response = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({ action: 'delete', targetPsnid })
          });
          
          let result = {};
          try { result = await response.json(); } catch(e) {}

          // ★ 古いシステムに繋がっている場合の警告
          if (result.status === 'success' && result.action_performed !== 'delete') {
             alert("【警告】\n削除機能がない古いシステムに繋がっています！\nスプレッドシート側で「新しいデプロイ」を行って新しいURLを取得し、HTMLに貼り直してください。");
             return;
          }

          // 削除成功後、最新状態をスプレッドシートから引っ張ってくる
          await loadData();
          setSelectedPlayer(null);
          showToast(`ターゲット「${targetPsnid}」を完全に削除しました`);
        } catch (error) {
          console.error(error);
          showToast("削除に失敗しました。");
        }
      };

      const handleExportCSV = () => {
        const headers = ["PSNID", "所属クラン", "罪状", "備考", "更新日", "危険度"];
        const rows = players.map(p => [
          `"${p.psnid}"`, `"${p.clan || '-'}"`, `"${(p.crimes || []).join(';')}"`, `"${(p.note || '').replace(/"/g, '""')}"`, `"${p.date}"`, `"${p.danger || 'C'}"`
        ]);
        const csvContent = "\uFEFF" + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", `deathnote_${activeTab}_${new Date().toISOString().split('T')[0]}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast("CSVを出力しました");
      };

      const renderDangerBadge = (danger) => {
        switch (danger) {
          case 'S': return <span className="px-2.5 py-0.5 rounded text-xs font-black bg-red-950 text-red-500 border border-red-700/80 shadow-[0_0_8px_rgba(220,38,38,0.5)]">S級 凶悪</span>;
          case 'A': return <span className="px-2 py-0.5 rounded text-xs font-bold bg-orange-950/80 text-orange-400 border border-orange-700/50">A級 高警戒</span>;
          case 'B': return <span className="px-2 py-0.5 rounded text-xs font-semibold bg-amber-950/60 text-amber-300 border border-amber-600/40">B級 注意</span>;
          case 'C': default: return <span className="px-2 py-0.5 rounded text-xs font-medium bg-zinc-800 text-zinc-400 border border-zinc-700">C級 一般</span>;
        }
      };

      if (isLoading) {
        return (
          <div className="min-h-screen flex flex-col items-center justify-center bg-death-bg text-white">
            <Icons.Loading />
            <p className="mt-4 text-zinc-400 font-serifJP tracking-widest text-sm">データベース同期中...</p>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col">
          {/* Header */}
          <header className="border-b border-death-border bg-black/90 sticky top-0 z-30 shadow-xl backdrop-blur-md">
            <div className="max-w-7xl mx-auto px-3 sm:px-6 py-3">
              <div className="flex items-center justify-between">
                <div className="flex items-center space-x-2.5 cursor-pointer" onClick={() => { setSearchTerm(''); setSelectedClan('ALL'); setSelectedCrimeTag('ALL'); setSelectedDanger('ALL'); }}>
                  <div className="w-9 h-9 sm:w-10 sm:h-10 rounded bg-gradient-to-br from-red-900 to-black border border-red-700 flex items-center justify-center shrink-0">
                    <Icons.Book />
                  </div>
                  <div>
                    <h1 className="font-cinzel text-xl sm:text-2xl font-black tracking-wider text-white leading-none">
                      DEATH NOTE
                    </h1>
                    <p className="text-[10px] sm:text-xs text-death-muted font-serifJP tracking-tight mt-0.5">
                      ブラックリスト D.B.
                    </p>
                  </div>
                </div>

                <div className="hidden sm:flex items-center space-x-2">
                  <button onClick={loadData} title="最新データに更新" className="p-2 rounded bg-zinc-800 hover:bg-zinc-700 text-zinc-300 border border-zinc-700">
                    <Icons.Reset />
                  </button>
                  {activeTab === 'main' && (
                    <button
                      onClick={() => setFormTarget('add')}
                      className="flex items-center gap-1.5 px-3.5 py-2 bg-red-700 hover:bg-red-600 text-white font-medium text-xs rounded border border-red-500 transition-all shadow-md"
                    >
                      <Icons.Plus />
                      <span>ターゲット追加</span>
                    </button>
                  )}
                  <button onClick={handleExportCSV} title="CSV出力" className="p-2 rounded bg-zinc-800 hover:bg-zinc-700 text-zinc-300 border border-zinc-700">
                    <Icons.Download />
                  </button>
                </div>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-3 sm:px-6 py-4 flex-grow w-full">
            
            {/* ★ 3つのタブ切り替えメニュー ★ */}

    function PlayerFormModal({ targetData, onClose, onSave }) {
      const isEdit = targetData !== 'add';
      const initialData = isEdit ? targetData : null;

      const [psnid, setPsnid] = useState(initialData ? initialData.psnid : '');
      const [clan, setClan] = useState(initialData ? (initialData.clan === '-' ? '' : initialData.clan) : '');
      const [crimesInput, setCrimesInput] = useState(initialData ? (initialData.crimes || []).join(', ') : '');

        e.preventDefault();
        if (!psnid.trim()) return;
        const crimesList = crimesInput.split(/[,、\s]+/).map(c => c.trim()).filter(c => c.length > 0);
        const updatedData = { ...(initialData || {}), psnid: psnid.trim(), clan: clan.trim() || "-", crimes: crimesList.length > 0 ? crimesList : ["要確認"], note: note.trim(), danger };
        onSave(updatedData, isEdit, isEdit ? initialData.psnid : null);
      };

              </div>
              <div className="grid grid-cols-2 gap-2.5">

                  <label className="block font-medium text-zinc-300 mb-1">所属クラン</label>
                  <input type="text" value={clan} onChange={(e) => setClan(e.target.value)} placeholder="例: tmp" className="w-full bg-zinc-950 text-white px-3 py-2 rounded border border-zinc-800 text-xs focus:outline-none focus:border-red-600" />
                </div>
                <div>
                  <label className="block font-medium text-zinc-300 mb-1">危険度</label>
                  <select value={danger} onChange={(e) => setDanger(e.target.value)} className="w-full bg-zinc-950 text-white px-3 py-2 rounded border border-zinc-800 text-xs focus:outline-none focus:border-red-600">
                    <option value="S">S級 (凶悪)</option><option value="A">A級 (高警戒)</option><option value="B">B級 (注意)</option><option value="C">C級 (一般)</option>
                  </select>
                </div>
              </div>
              <div>
                <label className="block font-medium text-zinc-300 mb-1">罪状タグ (カンマ区切り)</label>
                <input type="text" value={crimesInput} onChange={(e) => setCrimesInput(e.target.value)} placeholder="例: 放置, 煽り, 故意FF" className="w-full bg-zinc-950 text-white px-3 py-2 rounded border border-zinc-800 text-xs focus:outline-none focus:border-red-600" />
              </div>
              <div>
                <label className="block font-medium text-zinc-300 mb-1">備考・詳細</label>
                <textarea rows="3" value={note} onChange={(e) => setNote(e.target.value)} placeholder="詳細な行動記録、マッチ日時のメモ..." className="w-full bg-zinc-950 text-white px-3 py-2 rounded border border-zinc-800 text-xs focus:outline-none focus:border-red-600"></textarea>
              </div>
              <div className="pt-3 border-t border-zinc-800 flex justify-end space-x-2">
                <button type="button" onClick={onClose} className="px-4 py-2 bg-zinc-800 text-zinc-300 rounded text-xs border border-zinc-700">キャンセル</button>
                <button type="submit" className="px-5 py-2 bg-red-700 hover:bg-red-600 text-white font-medium text-xs rounded border border-red-500 flex items-center gap-1">
                  {isEdit ? <Icons.Edit /> : <Icons.Plus />}{isEdit ? '上書き保存' : 'ノートへ保存'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
